name: Android APK
on:
  workflow_dispatch:
    inputs:
      site_url:
        description: Live site URL the app loads
        required: true
      supabase_url:
        required: true
      publishable_key:
        required: true
permissions:
  contents: write
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - run: npm install --no-audit --no-fund
      - run: npm run build
        env:
          VITE_SUPABASE_URL: ${{ inputs.supabase_url }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ inputs.publishable_key }}
      - name: Add Capacitor (build-time only, package.json untouched)
        run: npm install --no-save --no-audit --no-fund @capacitor/core@6 @capacitor/cli@6 @capacitor/android@6 @capacitor/assets@3 @capacitor/local-notifications@6
      - name: Create the Android project
        run: |
          cat > capacitor.config.json <<JSON
          {"appId":"com.iconnecto.app","appName":"iConnecto","webDir":"dist","server":{"url":"${{ inputs.site_url }}","androidScheme":"https"}}
          JSON
          npx cap add android
          cp mobile/MainActivity.java android/app/src/main/java/com/iconnecto/app/MainActivity.java
          python3 - <<'PY'
          p='android/app/src/main/AndroidManifest.xml'
          s=open(p).read()
          perms=''.join('<uses-permission android:name="android.permission.%s" />\n'%x for x in ['CAMERA','RECORD_AUDIO','MODIFY_AUDIO_SETTINGS','POST_NOTIFICATIONS'])
          s=s.replace('</manifest>',perms+'</manifest>')
          open(p,'w').write(s)
          PY
          mkdir -p assets && cp design/logo-source.png assets/icon-only.png && cp design/logo-source.png assets/icon-foreground.png
          npx capacitor-assets generate --android --iconBackgroundColor '#ffffff' || echo "icon generation failed, default icon kept"
          grep -rl '@mipmap/ic_launcher_background' android/app/src/main/res | xargs -r sed -i 's#@mipmap/ic_launcher_background#@color/ic_launcher_background#g'
          npx cap sync android
      - name: Build debug APK
        run: |
          cd android
          if ! ./gradlew assembleDebug --no-daemon --stacktrace > ../gradle.log 2>&1; then
            msg=$(grep -E "error:|What went wrong|Caused by|FAILURE|Could not|not found|Unsupported|Execution failed" -A3 ../gradle.log | head -40 | sed 's/%/%25/g' | awk '{printf "%s%%0A", $0}')
            echo "::error title=Gradle failed::$msg"
            exit 1
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: iconnecto-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
      - name: Publish the APK on a separate branch
        run: |
          mkdir /tmp/pub && cp android/app/build/outputs/apk/debug/app-debug.apk /tmp/pub/iConnecto.apk && cd /tmp/pub
          git init -q -b built-apk
          git config user.name github-actions && git config user.email actions@github.com
          git add . && git commit -q -m "APK"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" built-apk
