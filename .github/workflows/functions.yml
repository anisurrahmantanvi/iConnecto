name: Deploy Supabase functions
# Run manually: Actions > Deploy Supabase functions > Run workflow.
# Needs the repository secret SUPABASE_ACCESS_TOKEN (Supabase > Account > Access Tokens).
# The function's own secrets (FCM_SERVICE_ACCOUNT, PUSH_WEBHOOK_SECRET) are set in Supabase > Edge Functions > Secrets, not here.
on:
  workflow_dispatch:
    inputs:
      project_ref:
        description: 'Supabase project ref (the part before .supabase.co)'
        required: true
        default: hcfehacsfirzwjqqcabb
jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - name: Check token
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then echo "::error::Repository secret SUPABASE_ACCESS_TOKEN is missing"; exit 1; fi
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: Deploy send-push (called by database triggers, checked by a shared secret)
        run: supabase functions deploy send-push --no-verify-jwt --project-ref "${{ inputs.project_ref }}"
