name: Deploy Supabase functions
# Run manually (Actions > Deploy Supabase functions > Run workflow).
# Needs the repository secret SUPABASE_ACCESS_TOKEN (Supabase > Account > Access Tokens).
# Didit keys are NOT stored here: set them in Supabase > Edge Functions > Secrets.
on:
  workflow_dispatch:
    inputs:
      project_ref:
        description: 'Supabase project ref (the part before .supabase.co)'
        required: true
        default: hcfehacsfirzwjqqcabb
jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - name: Check token
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then echo "::error::Repository secret SUPABASE_ACCESS_TOKEN is missing"; exit 1; fi
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: Deploy kyc-start (needs a signed-in user)
        run: supabase functions deploy kyc-start --project-ref "${{ inputs.project_ref }}"
      - name: Deploy kyc-webhook (called by Didit, checked by signature)
        run: supabase functions deploy kyc-webhook --no-verify-jwt --project-ref "${{ inputs.project_ref }}"
