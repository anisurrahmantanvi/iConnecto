name: TikTok embed check
on: workflow_dispatch
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Probe oEmbed and the embed player
        run: |
          U='https://www.tiktok.com/@scout2015/video/6718335390845095173'
          O='https://anisurrahmantanvi.github.io'
          a=$(curl -s -D - -o /tmp/o.json --max-time 30 -H "Origin: $O" "https://www.tiktok.com/oembed?url=$U" | grep -iE '^(HTTP|access-control|content-type)' | tr -d '\r' | tr '\n' ';')
          b=$(head -c 600 /tmp/o.json | tr '\n' ' ')
          c=$(curl -s -D - -o /dev/null --max-time 30 "https://www.tiktok.com/embed/v2/6718335390845095173" | grep -iE '^(HTTP|x-frame|content-security|content-type)' | tr -d '\r' | tr '\n' ';')
          echo "::notice title=oembed headers::$a"
          echo "::notice title=oembed body::$b"
          echo "::notice title=embed v2 headers::$c"
